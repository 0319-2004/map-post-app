<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>みんなの地図 — Firebase × MapLibre</title>

  <!-- MapLibre GL JS（地図） -->
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #bar {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.95); padding: 8px 12px;
      border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    #bar .grow { flex: 1; }
    #bar img { width: 28px; height: 28px; border-radius: 50%; vertical-align: middle; }
    button { font-size: 14px; padding: 8px 14px; border: 0; border-radius: 8px; cursor: pointer; font-weight: bold; }
    #loginBtn { background: #4285F4; color: #fff; }
    #logoutBtn { background: #eee; color: #333; }
    #panel {
      position: fixed; left: 12px; bottom: 12px; z-index: 10; width: 320px; max-width: 92vw;
      background: rgba(255,255,255,0.97); padding: 14px; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }
    #panel textarea { width: 100%; height: 60px; resize: vertical; padding: 8px; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
    #panel .row { display: flex; gap: 8px; margin-top: 8px; }
    #geoBtn { background: #43A047; color: #fff; }
    #postBtn { background: #E53935; color: #fff; flex: 1; }
    #status { font-size: 12px; color: #555; margin-top: 8px; min-height: 16px; }
    .hint { font-size: 12px; color: #666; }
    .disabled { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="bar">
    <div class="grow">
      <span id="userInfo" class="hint">サインインすると投稿できます</span>
    </div>
    <span class="hint">投稿数: <b id="count">0</b></span>
    <button id="loginBtn">Googleでサインイン</button>
    <button id="logoutBtn" style="display:none">サインアウト</button>
  </div>

  <div id="panel">
    <div class="hint">① 地図をクリック or「現在地」で場所を選ぶ → ② 文章を書いて投稿</div>
    <div id="form" class="disabled">
      <textarea id="text" maxlength="500" placeholder="この場所についてひとこと…"></textarea>
      <div class="row">
        <button id="geoBtn" type="button">現在地</button>
        <button id="postBtn" type="button">投稿する</button>
      </div>
    </div>
    <div id="status"></div>
  </div>

  <script type="module">
    // ===== Firebase（モジュラーSDK v12.15.0）=====
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // ===== 地図（MapLibre + OpenStreetMapタイル。APIキー不要）=====
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap contributors'
          }
        },
        layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
      },
      center: [139.7038, 35.6580], // 渋谷あたり
      zoom: 12
    });
    map.addControl(new maplibregl.NavigationControl());

    // ===== 画面部品 =====
    const loginBtn  = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userInfo  = document.getElementById('userInfo');
    const formBox   = document.getElementById('form');
    const textEl    = document.getElementById('text');
    const geoBtn    = document.getElementById('geoBtn');
    const postBtn   = document.getElementById('postBtn');
    const statusEl  = document.getElementById('status');
    const countEl   = document.getElementById('count');

    let currentUser = null;
    let picked = null;          // 選択中の投稿場所 {lng, lat}
    let pickMarker = null;      // 選択中の仮ピン（赤）
    const postMarkers = [];     // 表示中の投稿ピン（青）

    // ===== 認証 =====
    loginBtn.onclick  = () => signInWithPopup(auth, provider).catch(e => alert(e.message));
    logoutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        loginBtn.style.display = 'none';
        logoutBtn.style.display = '';
        const icon = user.photoURL ? `<img src="${user.photoURL}" alt="">` : '';
        userInfo.innerHTML = `${icon} <b>${escapeHtml(user.displayName || 'ユーザー')}</b> でログイン中`;
        formBox.classList.remove('disabled');
      } else {
        loginBtn.style.display = '';
        logoutBtn.style.display = 'none';
        userInfo.textContent = 'サインインすると投稿できます';
        formBox.classList.add('disabled');
      }
    });

    // ===== 場所を選ぶ（地図クリック or 現在地）=====
    map.on('click', (e) => setPick(e.lngLat.lng, e.lngLat.lat));

    geoBtn.onclick = () => {
      if (!navigator.geolocation) return alert('この端末では現在地を使えません');
      statusEl.textContent = '現在地を取得中…';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          setPick(pos.coords.longitude, pos.coords.latitude);
          map.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 15 });
        },
        (err) => { statusEl.textContent = '現在地を取得できませんでした：' + err.message; }
      );
    };

    function setPick(lng, lat) {
      picked = { lng, lat };
      if (pickMarker) pickMarker.remove();
      pickMarker = new maplibregl.Marker({ color: '#E53935' }).setLngLat([lng, lat]).addTo(map);
      statusEl.textContent = `場所を選択：${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }

    // ===== 投稿する（Firestoreに書き込み）=====
    postBtn.onclick = async () => {
      if (!currentUser) return alert('先にサインインしてください');
      if (!picked)      return alert('地図をクリックするか「現在地」で場所を選んでください');
      const text = textEl.value.trim();
      if (!text)        return alert('ひとこと書いてください');
      postBtn.disabled = true;
      try {
        await addDoc(collection(db, 'posts'), {
          uid: currentUser.uid,
          name: currentUser.displayName || '名無し',
          photoURL: currentUser.photoURL || '',
          text,
          lat: picked.lat,
          lng: picked.lng,
          createdAt: serverTimestamp()
        });
        textEl.value = '';
        if (pickMarker) { pickMarker.remove(); pickMarker = null; }
        picked = null;
        statusEl.textContent = '投稿しました！';
      } catch (e) {
        statusEl.textContent = '投稿に失敗：' + e.message;
      } finally {
        postBtn.disabled = false;
      }
    };

    // ===== リアルタイム表示（onSnapshot）=====
    const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
    onSnapshot(q, (snap) => {
      postMarkers.forEach(m => m.remove());
      postMarkers.length = 0;
      snap.forEach(docSnap => {
        const p = docSnap.data();
        if (typeof p.lat !== 'number' || typeof p.lng !== 'number') return;
        const popup = new maplibregl.Popup({ offset: 16 }).setHTML(
          `<strong>${escapeHtml(p.name)}</strong><br>${escapeHtml(p.text)}`
        );
        const marker = new maplibregl.Marker({ color: '#1E88E5' })
          .setLngLat([p.lng, p.lat]).setPopup(popup).addTo(map);
        postMarkers.push(marker);
      });
      countEl.textContent = snap.size;
    }, (err) => {
      statusEl.textContent = '読み込みエラー：' + err.message + '（ルール未設定かも）';
    });

    // XSS対策：投稿文をそのままHTMLに入れない
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
